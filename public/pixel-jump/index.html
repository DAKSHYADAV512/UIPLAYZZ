<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pixel Jump: Tower Ascent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #080b14; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }
    canvas { display: block; margin: 0 auto; width: 100%; height: 100%; max-width: 500px; background: #0c1021; box-shadow: 0 0 40px rgba(0,0,0,0.8); }
    #hud {
      position: absolute; top: 16px; left: 0; right: 0;
      display: flex; justify-content: space-around;
      pointer-events: none; z-index: 10; max-width: 500px; margin: 0 auto;
    }
    .badge {
      background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(52, 211, 153, 0.4);
      border-radius: 9999px; padding: 6px 16px; font-weight: 700; font-size: 14px;
      color: #34d399; backdrop-filter: blur(8px);
    }
    #overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: rgba(8, 11, 20, 0.88);
      backdrop-filter: blur(8px); z-index: 20; text-align: center; padding: 20px;
    }
    h1 { font-size: 32px; font-weight: 900; margin-bottom: 8px; background: linear-gradient(135deg, #34d399, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; max-width: 320px; line-height: 1.5; }
    .btn {
      background: linear-gradient(135deg, #10b981, #06b6d4); color: white; border: none;
      padding: 12px 36px; font-size: 16px; font-weight: 700; border-radius: 9999px;
      cursor: pointer; box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); transition: transform 0.15s;
    }
    .btn:hover { transform: scale(1.05); }
    .hint { margin-top: 16px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div id="hud">
    <div class="badge">ALTITUDE: <span id="height-val">0</span>m</div>
    <div class="badge">COINS: <span id="coins-val">0</span></div>
  </div>

  <div id="overlay">
    <h1 id="title">PIXEL JUMP</h1>
    <p id="desc">Ascend the quantum cyber spire! Bounce between kinetic platforms and grab energy sparks.</p>
    <button class="btn" id="start-btn">JUMP IN</button>
    <div class="hint">Left / Right Arrows or A / D to steer • Touch Screen left/right on Mobile</div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const heightEl = document.getElementById('height-val');
    const coinsEl = document.getElementById('coins-val');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const titleEl = document.getElementById('title');
    const descEl = document.getElementById('desc');

    const W = 460;
    const H = 700;
    canvas.width = W;
    canvas.height = H;

    let state = 'menu';
    let altitude = 0;
    let coins = 0;
    let soundOn = true;

    const player = {
      x: W / 2 - 16,
      y: H - 120,
      w: 32,
      h: 32,
      vx: 0,
      vy: 0,
      gravity: 0.42,
      jumpForce: -11.5
    };

    let platforms = [];
    let coinItems = [];
    let cameraY = 0;

    let audioCtx = null;
    function boing(freq = 400) {
      if (!soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.5, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch(e){}
    }

    window.addEventListener('message', e => {
      if (e.data && e.data.type === 'UNIPLAYZZ_TOGGLE_SOUND') soundOn = e.data.enabled;
    });

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Mobile touch
    window.addEventListener('touchstart', e => {
      const touchX = e.touches[0].clientX;
      const screenMid = window.innerWidth / 2;
      if (touchX < screenMid) {
        keys['ArrowLeft'] = true;
        keys['ArrowRight'] = false;
      } else {
        keys['ArrowRight'] = true;
        keys['ArrowLeft'] = false;
      }
    });
    window.addEventListener('touchend', () => {
      keys['ArrowLeft'] = false;
      keys['ArrowRight'] = false;
    });

    function initGame() {
      state = 'playing';
      altitude = 0;
      coins = 0;
      heightEl.innerText = '0';
      coinsEl.innerText = '0';
      player.x = W / 2 - 16;
      player.y = H - 120;
      player.vx = 0;
      player.vy = player.jumpForce;
      cameraY = 0;

      // Base platform
      platforms = [
        { x: W / 2 - 50, y: H - 50, w: 100, h: 14, type: 'normal' }
      ];

      // Generate initial platforms
      for (let y = H - 120; y > -1000; y -= 65) {
        createPlatform(y);
      }

      overlay.style.display = 'none';
      boing(450);
    }
    startBtn.addEventListener('click', initGame);

    function createPlatform(y) {
      const w = 75;
      const x = Math.random() * (W - w - 20) + 10;
      const isMoving = Math.random() > 0.7;
      platforms.push({
        x, y, w, h: 12,
        type: isMoving ? 'moving' : 'normal',
        vx: isMoving ? (Math.random() > 0.5 ? 1.5 : -1.5) : 0
      });

      if (Math.random() > 0.6) {
        coinItems.push({ x: x + w / 2, y: y - 20, collected: false });
      }
    }

    function gameOver() {
      state = 'over';
      titleEl.innerText = 'SPIRE FALL';
      descEl.innerHTML = `You tumbled into the cyber abyss!<br/>Altitude reached: <strong>${altitude}m</strong> with <strong>${coins} coins</strong>.`;
      startBtn.innerText = 'CLIMB AGAIN';
      overlay.style.display = 'flex';

      const totalScore = altitude * 10 + coins * 50;
      try {
        window.parent.postMessage({
          type: 'UNIPLAYZZ_SCORE',
          score: Math.max(50, totalScore),
          gameSlug: 'pixel-jump'
        }, '*');
      } catch(e){}
    }

    function update() {
      if (state !== 'playing') return;

      // Movement
      if (keys['ArrowLeft'] || keys['KeyA']) player.vx = -6.5;
      else if (keys['ArrowRight'] || keys['KeyD']) player.vx = 6.5;
      else player.vx *= 0.8;

      player.x += player.vx;
      if (player.x < -player.w) player.x = W;
      if (player.x > W) player.x = -player.w;

      player.vy += player.gravity;
      player.y += player.vy;

      // Camera scroll when player is in upper half
      if (player.y < H / 2) {
        const diff = (H / 2) - player.y;
        player.y = H / 2;
        cameraY += diff;
        altitude = Math.floor(cameraY / 10);
        heightEl.innerText = altitude;

        // Shift platforms & coins
        for (const p of platforms) p.y += diff;
        for (const c of coinItems) c.y += diff;
      }

      // Update moving platforms
      for (const p of platforms) {
        if (p.type === 'moving') {
          p.x += p.vx;
          if (p.x <= 10 || p.x + p.w >= W - 10) p.vx = -p.vx;
        }

        // Jump collision (only when falling downwards)
        if (
          player.vy > 0 &&
          player.x + player.w > p.x &&
          player.x < p.x + p.w &&
          player.y + player.h >= p.y &&
          player.y + player.h <= p.y + p.h + 8
        ) {
          player.vy = player.jumpForce;
          player.y = p.y - player.h;
          boing(380 + Math.min(200, altitude));
        }
      }

      // Collect coins
      for (const c of coinItems) {
        if (!c.collected && Math.hypot((player.x + 16) - c.x, (player.y + 16) - c.y) < 24) {
          c.collected = true;
          coins++;
          coinsEl.innerText = coins;
          boing(880);
        }
      }

      // Remove off-screen platforms and generate new ones above
      platforms = platforms.filter(p => p.y < H + 50);
      coinItems = coinItems.filter(c => c.y < H + 50);

      const highestY = Math.min(...platforms.map(p => p.y));
      if (highestY > -100) {
        createPlatform(highestY - 65);
      }

      // Fall off bottom
      if (player.y > H + 50) {
        gameOver();
      }
    }

    function render() {
      ctx.fillStyle = '#0c1021';
      ctx.fillRect(0, 0, W, H);

      // Background stars / depth dots
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      for (let i = 0; i < 40; i++) {
        const sx = ((i * 37) % W);
        const sy = ((i * 83 + cameraY * 0.3) % H);
        ctx.fillRect(sx, sy, 2, 2);
      }

      // Platforms
      for (const p of platforms) {
        ctx.fillStyle = p.type === 'moving' ? '#38bdf8' : '#34d399';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.w, p.h, 6);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // Coins
      for (const c of coinItems) {
        if (!c.collected) {
          ctx.fillStyle = '#fbbf24';
          ctx.shadowColor = '#fbbf24';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.arc(c.x, c.y, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }

      // Player
      ctx.save();
      ctx.fillStyle = '#a855f7';
      ctx.shadowColor = '#a855f7';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.roundRect(player.x, player.y, player.w, player.h, 8);
      ctx.fill();

      // Eyes
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(player.x + (player.vx >= 0 ? 18 : 6), player.y + 8, 4, 8);
      ctx.fillRect(player.x + (player.vx >= 0 ? 24 : 12), player.y + 8, 4, 8);
      ctx.restore();

      requestAnimationFrame(render);
    }

    setInterval(update, 1000 / 60);
    render();
  </script>
</body>
</html>
