<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Chroma Matrix: Color Puzzle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }
    .container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 20px; }
    .badge { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(147, 51, 234, 0.4); border-radius: 8px; padding: 6px 14px; font-size: 13px; font-weight: 700; color: #cbd5e1; }
    .badge span { color: #38bdf8; font-size: 16px; margin-left: 4px; }
    #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 440px; aspect-ratio: 1; background: rgba(15, 23, 42, 0.6); padding: 14px; border-radius: 16px; border: 1px solid rgba(147, 51, 234, 0.3); box-shadow: 0 0 30px rgba(0,0,0,0.5); }
    .tile { border-radius: 10px; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; border: 2px solid transparent; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.4); user-select: none; }
    .tile:hover { transform: scale(1.04); }
    .c-0 { background: #3b82f6; box-shadow: 0 0 14px rgba(59, 130, 246, 0.5); }
    .c-1 { background: #10b981; box-shadow: 0 0 14px rgba(16, 185, 129, 0.5); }
    .c-2 { background: #f59e0b; box-shadow: 0 0 14px rgba(245, 158, 11, 0.5); }
    .c-3 { background: #ec4899; box-shadow: 0 0 14px rgba(236, 72, 153, 0.5); }
    #target-box { margin-top: 20px; text-align: center; }
    .target-desc { font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    .target-preview { display: inline-block; width: 28px; height: 28px; border-radius: 6px; vertical-align: middle; margin-left: 6px; }
    #overlay { position: absolute; inset: 0; background: rgba(11, 15, 25, 0.92); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    h1 { font-size: 32px; font-weight: 900; margin-bottom: 8px; background: linear-gradient(135deg, #a855f7, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: #94a3b8; font-size: 14px; max-width: 320px; line-height: 1.5; margin-bottom: 24px; }
    .btn { background: linear-gradient(135deg, #9333ea, #3b82f6); color: white; border: none; padding: 12px 36px; font-size: 16px; font-weight: 700; border-radius: 9999px; cursor: pointer; box-shadow: 0 0 20px rgba(147, 51, 234, 0.4); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="badge">MOVES: <span id="moves-val">25</span></div>
      <div class="badge">LEVEL: <span id="level-val">1</span></div>
      <div class="badge">SCORE: <span id="score-val">0</span></div>
    </div>

    <div id="grid"></div>

    <div id="target-box">
      <span class="target-desc">Target Harmonic Hue:</span>
      <span id="target-swatch" class="target-preview c-0"></span>
      <div style="font-size: 11px; color: #64748b; margin-top: 4px;">Convert the entire matrix into the target color!</div>
    </div>
  </div>

  <div id="overlay">
    <h1 id="title">CHROMA MATRIX</h1>
    <p id="desc">Transmit color wave impulses across the cyber grid. Clicking a tile ripples color shifts into neighboring cells.</p>
    <button class="btn" id="start-btn">INITIATE MATRIX</button>
  </div>

  <script>
    const gridEl = document.getElementById('grid');
    const movesEl = document.getElementById('moves-val');
    const levelEl = document.getElementById('level-val');
    const scoreEl = document.getElementById('score-val');
    const targetSwatch = document.getElementById('target-swatch');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const titleEl = document.getElementById('title');
    const descEl = document.getElementById('desc');

    const SIZE = 4;
    let grid = [];
    let moves = 25;
    let level = 1;
    let score = 0;
    let targetColor = 0;
    let soundOn = true;

    let audioCtx = null;
    function playBeep(noteFreq) {
      if (!soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(noteFreq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch(e){}
    }

    window.addEventListener('message', e => {
      if (e.data && e.data.type === 'UNIPLAYZZ_TOGGLE_SOUND') soundOn = e.data.enabled;
    });

    function initLevel() {
      moves = Math.max(12, 28 - level * 2);
      movesEl.innerText = moves;
      levelEl.innerText = level;
      scoreEl.innerText = score;
      targetColor = Math.floor(Math.random() * 4);
      targetSwatch.className = `target-preview c-${targetColor}`;

      grid = [];
      gridEl.innerHTML = '';
      for (let r = 0; r < SIZE; r++) {
        grid[r] = [];
        for (let c = 0; c < SIZE; c++) {
          const val = Math.floor(Math.random() * 4);
          grid[r][c] = val;
          const tile = document.createElement('div');
          tile.className = `tile c-${val}`;
          tile.dataset.r = r;
          tile.dataset.c = c;
          tile.addEventListener('click', () => onTileClick(r, c));
          gridEl.appendChild(tile);
        }
      }
    }

    function onTileClick(r, c) {
      if (moves <= 0) return;
      moves--;
      movesEl.innerText = moves;

      // Ripple change: clicked cell + neighbors
      cycleCell(r, c);
      if (r > 0) cycleCell(r - 1, c);
      if (r < SIZE - 1) cycleCell(r + 1, c);
      if (c > 0) cycleCell(r, c - 1);
      if (c < SIZE - 1) cycleCell(r, c + 1);

      playBeep(300 + (r * 4 + c) * 20);

      // Check win
      let allMatch = true;
      for (let i = 0; i < SIZE; i++) {
        for (let j = 0; j < SIZE; j++) {
          if (grid[i][j] !== targetColor) {
            allMatch = false;
            break;
          }
        }
      }

      if (allMatch) {
        score += 500 + moves * 50;
        level++;
        playBeep(880);
        setTimeout(() => {
          initLevel();
        }, 300);
      } else if (moves <= 0) {
        gameOver();
      }
    }

    function cycleCell(r, c) {
      grid[r][c] = (grid[r][c] + 1) % 4;
      const idx = r * SIZE + c;
      const tile = gridEl.children[idx];
      tile.className = `tile c-${grid[r][c]}`;
    }

    function startGame() {
      level = 1;
      score = 0;
      overlay.style.display = 'none';
      initLevel();
    }
    startBtn.addEventListener('click', startGame);

    function gameOver() {
      titleEl.innerText = 'ENERGY DEPLETED';
      descEl.innerHTML = `You ran out of moves.<br/>Matrix Nodes Solved: <strong>Level ${level}</strong><br/>Score: <strong>${score}</strong>`;
      startBtn.innerText = 'REBOOT MATRIX';
      overlay.style.display = 'flex';

      try {
        window.parent.postMessage({
          type: 'UNIPLAYZZ_SCORE',
          score,
          gameSlug: 'chroma-matrix'
        }, '*');
      } catch(e){}
    }
  </script>
</body>
</html>
