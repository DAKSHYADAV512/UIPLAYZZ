<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Space Runner: Neon Odyssey</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #070913; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute; top: 12px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none; z-index: 10;
    }
    .badge {
      background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(139, 92, 246, 0.4);
      border-radius: 8px; padding: 6px 14px; font-weight: 700; letter-spacing: 0.5px;
      backdrop-filter: blur(8px); text-shadow: 0 0 8px rgba(168, 85, 247, 0.6);
      font-size: 14px;
    }
    .score-val { color: #38bdf8; font-size: 18px; margin-left: 6px; }
    .speed-val { color: #f43f5e; font-size: 16px; margin-left: 6px; }
    #overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: rgba(7, 9, 19, 0.85);
      backdrop-filter: blur(10px); z-index: 20; text-align: center; padding: 20px;
    }
    h1 { font-size: 32px; font-weight: 900; letter-spacing: 1px; margin-bottom: 8px; background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: #94a3b8; font-size: 15px; margin-bottom: 24px; max-width: 360px; line-height: 1.5; }
    .btn {
      background: linear-gradient(135deg, #6366f1, #a855f7); color: white; border: none;
      padding: 12px 32px; font-size: 16px; font-weight: 700; border-radius: 9999px;
      cursor: pointer; box-shadow: 0 0 20px rgba(168, 85, 247, 0.5); transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(168, 85, 247, 0.8); }
    .controls-hint { margin-top: 20px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div id="hud">
    <div class="badge">SCORE: <span id="score" class="score-val">0</span></div>
    <div class="badge">MULTIPLIER: <span id="mult" class="speed-val">1.0x</span></div>
  </div>

  <div id="overlay">
    <h1 id="title">SPACE RUNNER</h1>
    <p id="subtitle">Pilot the neon interceptor through deep space. Dodge orbital debris and collect quantum flux cores!</p>
    <button class="btn" id="start-btn">ENGAGE THRUSTERS</button>
    <div class="controls-hint">Controls: Arrow Keys / A & D to Steer • Touch & Drag on Mobile</div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const multEl = document.getElementById('mult');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const titleEl = document.getElementById('title');
    const subtitleEl = document.getElementById('subtitle');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let state = 'menu'; // menu, playing, gameover
    let score = 0;
    let multiplier = 1.0;
    let speed = 7;
    let distance = 0;
    let soundOn = true;

    // Ship
    const ship = {
      x: width / 2,
      y: height - 100,
      width: 44,
      height: 48,
      targetX: width / 2,
      shield: 100,
      trail: []
    };

    // Stars
    const stars = Array.from({ length: 90 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 2 + 1,
      speed: Math.random() * 3 + 2,
      color: ['#38bdf8', '#818cf8', '#c084fc', '#ffffff'][Math.floor(Math.random() * 4)]
    }));

    // Obstacles & Pickups
    let obstacles = [];
    let pickups = [];
    let particles = [];
    let spawnTimer = 0;
    let pickupTimer = 0;

    // Controls
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space' && state !== 'playing') startGame();
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Touch support
    let touchActive = false;
    canvas.addEventListener('pointerdown', e => {
      touchActive = true;
      ship.targetX = e.clientX;
    });
    window.addEventListener('pointermove', e => {
      if (touchActive) ship.targetX = e.clientX;
    });
    window.addEventListener('pointerup', () => touchActive = false);

    // Audio synthesizer
    let audioCtx = null;
    function playBeep(freq, type = 'sine', duration = 0.1) {
      if (!soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (err) {}
    }

    // Post message listener from UNIPLAYZZ platform
    window.addEventListener('message', e => {
      if (e.data && e.data.type === 'UNIPLAYZZ_TOGGLE_SOUND') {
        soundOn = e.data.enabled;
      }
      if (e.data && e.data.type === 'UNIPLAYZZ_PAUSE') {
        if (state === 'playing') state = 'paused';
        else if (state === 'paused') state = 'playing';
      }
    });

    function startGame() {
      state = 'playing';
      score = 0;
      multiplier = 1.0;
      speed = 7;
      distance = 0;
      obstacles = [];
      pickups = [];
      particles = [];
      ship.x = width / 2;
      ship.targetX = width / 2;
      ship.y = height - 100;
      overlay.style.display = 'none';
      playBeep(440, 'triangle', 0.15);
    }

    startBtn.addEventListener('click', startGame);

    function gameOver() {
      state = 'gameover';
      titleEl.innerText = 'MISSION FAILED';
      subtitleEl.innerHTML = `Your starship disintegrated in deep space.<br/><br/><strong>FINAL SCORE: ${Math.floor(score)}</strong>`;
      startBtn.innerText = 'PLAY AGAIN';
      overlay.style.display = 'flex';
      playBeep(140, 'sawtooth', 0.4);

      // Report score to UNIPLAYZZ
      try {
        window.parent.postMessage({
          type: 'UNIPLAYZZ_SCORE',
          score: Math.floor(score),
          gameSlug: 'space-runner'
        }, '*');
      } catch (err) {}
    }

    function createExplosion(x, y, color = '#f43f5e', count = 18) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 6 + 2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          size: Math.random() * 4 + 2,
          life: 1,
          color
        });
      }
    }

    function update() {
      if (state !== 'playing') return;

      distance += speed;
      score += (speed / 10) * multiplier;
      scoreEl.innerText = Math.floor(score);
      multiplier = Math.min(4.0, 1.0 + Math.floor(score / 500) * 0.2);
      multEl.innerText = multiplier.toFixed(1) + 'x';
      speed = 7 + Math.min(8, score / 1200);

      // Ship movement
      if (keys['ArrowLeft'] || keys['KeyA']) ship.targetX -= 12;
      if (keys['ArrowRight'] || keys['KeyD']) ship.targetX += 12;
      ship.targetX = Math.max(30, Math.min(width - 30, ship.targetX));
      ship.x += (ship.targetX - ship.x) * 0.2;
      ship.y = height - 100;

      // Engine trail
      ship.trail.push({ x: ship.x, y: ship.y + 20, life: 1 });
      if (ship.trail.length > 14) ship.trail.shift();

      // Spawn obstacles
      spawnTimer++;
      if (spawnTimer > Math.max(25, 60 - Math.floor(score / 300))) {
        spawnTimer = 0;
        obstacles.push({
          x: Math.random() * (width - 60) + 30,
          y: -40,
          size: Math.random() * 26 + 20,
          speed: speed + Math.random() * 2,
          rot: 0,
          rotSpeed: (Math.random() - 0.5) * 0.1
        });
      }

      // Spawn pickups (Quantum Cores)
      pickupTimer++;
      if (pickupTimer > 90) {
        pickupTimer = 0;
        pickups.push({
          x: Math.random() * (width - 60) + 30,
          y: -30,
          size: 14,
          speed: speed * 0.9,
          pulse: 0
        });
      }

      // Update obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.y += obs.speed;
        obs.rot += obs.rotSpeed;

        // Collision with ship
        const dx = obs.x - ship.x;
        const dy = obs.y - ship.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < obs.size + 18) {
          createExplosion(ship.x, ship.y, '#f43f5e', 30);
          gameOver();
          return;
        }

        if (obs.y > height + 50) obstacles.splice(i, 1);
      }

      // Update pickups
      for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        p.y += p.speed;
        p.pulse += 0.1;

        const dx = p.x - ship.x;
        const dy = p.y - ship.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < p.size + 22) {
          score += 150 * multiplier;
          createExplosion(p.x, p.y, '#38bdf8', 12);
          playBeep(880, 'sine', 0.12);
          pickups.splice(i, 1);
          continue;
        }

        if (p.y > height + 40) pickups.splice(i, 1);
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= 0.03;
        if (pt.life <= 0) particles.splice(i, 1);
      }
    }

    function render() {
      ctx.fillStyle = '#070913';
      ctx.fillRect(0, 0, width, height);

      // Stars
      for (const star of stars) {
        if (state === 'playing') star.y += star.speed * (speed / 7);
        else star.y += star.speed * 0.4;
        if (star.y > height) {
          star.y = 0;
          star.x = Math.random() * width;
        }
        ctx.fillStyle = star.color;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
      }

      // Neon road / horizon grid lines
      ctx.strokeStyle = 'rgba(99, 102, 241, 0.15)';
      ctx.lineWidth = 1;
      const laneCount = 5;
      for (let i = 0; i <= laneCount; i++) {
        const lx = (width / laneCount) * i;
        ctx.beginPath();
        ctx.moveTo(lx, 0);
        ctx.lineTo(lx, height);
        ctx.stroke();
      }

      // Particles
      for (const pt of particles) {
        ctx.globalAlpha = Math.max(0, pt.life);
        ctx.fillStyle = pt.color;
        ctx.shadowColor = pt.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      ctx.globalAlpha = 1;

      // Obstacles (Asteroids)
      for (const obs of obstacles) {
        ctx.save();
        ctx.translate(obs.x, obs.y);
        ctx.rotate(obs.rot);
        ctx.strokeStyle = '#f43f5e';
        ctx.fillStyle = 'rgba(244, 63, 94, 0.2)';
        ctx.shadowColor = '#f43f5e';
        ctx.shadowBlur = 12;
        ctx.lineWidth = 2.5;

        ctx.beginPath();
        const pts = 6;
        for (let p = 0; p < pts; p++) {
          const a = (p / pts) * Math.PI * 2;
          const r = obs.size * (p % 2 === 0 ? 1 : 0.75);
          const px = Math.cos(a) * r;
          const py = Math.sin(a) * r;
          if (p === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      // Pickups (Quantum Cores)
      for (const p of pickups) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.strokeStyle = '#38bdf8';
        ctx.fillStyle = '#0284c7';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 15;
        ctx.lineWidth = 2;

        const pulseScale = 1 + Math.sin(p.pulse) * 0.2;
        ctx.scale(pulseScale, pulseScale);

        ctx.beginPath();
        ctx.arc(0, 0, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 0, p.size * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Engine Trail
      for (let i = 0; i < ship.trail.length; i++) {
        const t = ship.trail[i];
        const alpha = (i / ship.trail.length) * 0.7;
        ctx.fillStyle = `rgba(56, 189, 248, ${alpha})`;
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(t.x, t.y, (i / ship.trail.length) * 9, 0, Math.PI * 2);
        ctx.fill();
      }

      // Player Ship
      if (state === 'playing') {
        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.shadowColor = '#a855f7';
        ctx.shadowBlur = 16;

        // Cockpit body
        ctx.fillStyle = '#0f172a';
        ctx.strokeStyle = '#a855f7';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(0, -24);
        ctx.lineTo(20, 20);
        ctx.lineTo(8, 14);
        ctx.lineTo(0, 18);
        ctx.lineTo(-8, 14);
        ctx.lineTo(-20, 20);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Neon core
        ctx.fillStyle = '#38bdf8';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(0, -10);
        ctx.lineTo(5, 6);
        ctx.lineTo(-5, 6);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      requestAnimationFrame(render);
    }

    setInterval(update, 1000 / 60);
    render();
  </script>
</body>
</html>
